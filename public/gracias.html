<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envío recibido — Baltic Transline</title>
<meta name="robots" content="noindex">
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f7fb;
    color: #1c2733;
    line-height: 1.5;
  }
  .contenedor {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 16px;
  }
  .tarjeta {
    background: #fff;
    border: 1px solid #d5deea;
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
  }
  .icono {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    background: #e6f4ea;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    color: #1e7e34;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 8px;
    color: #0b3a66;
  }
  p { color: #5c6b7c; margin: 0 0 16px; }
  a.boton {
    display: inline-block;
    margin-top: 8px;
    background: #0b3a66;
    color: #fff;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
  }
  a.boton:hover { background: #0d4a80; }
</style>
</head>
<body>
<div class="contenedor">
  <div class="tarjeta">
    <div class="icono">✓</div>
    <h1>¡Envío recibido!</h1>
    <p>Gracias. Tu documentación fue enviada correctamente y el equipo de Baltic Transline la va a revisar a la brevedad.</p>
    <p>Si falta algún documento o hay algún problema, nos vamos a comunicar con vos por email.</p>
    <a class="boton" href="/">Volver a la página de carga</a>
  </div>
</div>
</body>
</html>
